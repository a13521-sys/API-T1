<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolução da ficha 02</title>
    <style>
        body{background-color:#f2f2f2;}
            ul{background-color: lightblue;}
            ol{background-color: rgb(255, 236, 179);}
    </style>
</head>
<body>
    <h1>Listas</h1>
    <hr color="grey">
    <h2>Listas não numeradas</h2>
    <ul style="list-style-type: circle;">
        <li>Faculdade de Engenheria</li>

        <ul style="list-style-type: square;">
            <li>Departamentos</li>
            <ul style="list-style-type: disc;">
                <li>DEQ</li>
                <li>DEC</li>
                <li>DECC</li>
                <li>...</li>
            </ul>

            <li>Serviços</li>
            <ul style="list-style-type: disc;">
                <li>CICA</li>
                <li>Biblioteca</li>
                <li>...</li>
            </ul>

        </ul>
        <li>Faculdade de Medicina</li>

    </ul>
    <hr color="grey">
    <h2>Listas numeradas</h2>
    <ol type="A">
        <li>Escola da Luz</li>
        <li>Escola da Paz</li>

    </ol>
</body>
</html>
